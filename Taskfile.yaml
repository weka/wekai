version: "3"

vars:
  IMAGE: wekai-core
  TAG: '{{.TAG | default "dev"}}'
  REPLAY_IMAGE: '{{.REPLAY_IMAGE | default "quay.io/weka.io/wekai-benchmark:replay-099a98c60fd7"}}'
  REGISTRY: '{{.REGISTRY | default "quay.io/weka.io/wekai-core"}}'
  REPLAY_REGISTRY: '{{.REPLAY_REGISTRY | default "quay.io/weka.io/wekai-benchmark"}}'
  HELM_REGISTRY: '{{.HELM_REGISTRY | default "quay.io/weka.io/helm"}}'

tasks:
  build:
    desc: "Build the wekai-core binary locally"
    cmds:
      - go build -o wekai-core .

  test:
    desc: "Run all tests"
    cmds:
      - go test ./... -timeout 120s -count=1

  docker:build:
    desc: "Build the wekai-core replay image locally (no push). Override TAG=... and REPLAY_IMAGE=... as needed."
    cmds:
      - >-
        docker build
        --build-arg REPLAY_IMAGE={{.REPLAY_IMAGE}}
        -t {{.IMAGE}}:{{.TAG}}
        .

  replay:push:
    desc: "Push a replay JSONL as a layer image (replay-<hash>) under the wekai-benchmark repo (dagger call push-replay). Override REPLAY_REGISTRY=... as needed."
    requires:
      vars: [REPLAY]
    cmds:
      - >-
        dagger call push-replay
        --replay="{{.REPLAY}}"
        --registry="{{.REPLAY_REGISTRY}}"

  app:push:
    desc: "Build (from this repo's Dockerfile) and publish the wekai-core image (dagger call publish). Override REGISTRY=... and REPLAY_IMAGE=... as needed."
    cmds:
      - >-
        dagger call publish
        --source=.
        --registry="{{.REGISTRY}}"
        --replay-image="{{.REPLAY_IMAGE}}"

  helm:push:
    desc: "Publish the wekai-core image, then package+push chart/wekai-core pinned to it (dagger call push-helm). Override REGISTRY=..., HELM_REGISTRY=..., and REPLAY_IMAGE=... as needed."
    cmds:
      - >-
        dagger call push-helm
        --source=.
        --registry="{{.REGISTRY}}"
        --replay-image="{{.REPLAY_IMAGE}}"
        --helm-registry="{{.HELM_REGISTRY}}"
        --helm-username=env://QUAY_USERNAME
        --helm-password=env://QUAY_PASSWORD
