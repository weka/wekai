name: release

# On every push to main: derive the next semver from Conventional Commits
# (feat: -> minor, fix: -> patch, BREAKING CHANGE/! -> major; see CLAUDE.md —
# semantic commits are mandatory in this repo), publish the image + Helm
# chart under that semver via the repo's own Dagger module (overriding the
# local content-hash v999.0.0-<sha12> scheme), and create a GitHub Release
# with install instructions.
#
# No release is cut when no feat/fix/breaking commits landed since the last
# tag (docs/chore/ci-only pushes are silent).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the tag action walks commits since the last tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./... -timeout 300s

      - name: Compute next semver from Conventional Commits
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false # no feat/fix/breaking since last tag -> no release
          tag_prefix: v

      - name: No release needed
        if: steps.semver.outputs.new_tag == ''
        run: echo "No feat/fix/BREAKING commits since ${{ steps.semver.outputs.previous_tag }} — skipping release."

      - name: Log in to quay.io
        if: steps.semver.outputs.new_tag != ''
        run: echo "${{ secrets.QUAY_PASSWORD }}" | docker login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Install Dagger CLI
        if: steps.semver.outputs.new_tag != ''
        run: |
          cd /usr/local
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.18.6 sh
          dagger version

      - name: Publish image + chart under semver (dagger push-helm)
        if: steps.semver.outputs.new_tag != ''
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          dagger call push-helm \
            --source=. \
            --helm-username=env://QUAY_USERNAME \
            --helm-password=env://QUAY_PASSWORD \
            --version "${{ steps.semver.outputs.new_tag }}"

      - name: Create GitHub Release
        if: steps.semver.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.new_tag }}
          generate_release_notes: true
          body: |
            ## Install

            Helm (replay benchmark against your endpoint — see README for all values):

            ```
            helm install my-replay oci://quay.io/weka.io/helm/wekai-core \
              --version ${{ steps.semver.outputs.new_tag }} \
              --set endpoint=http://YOUR-LLM-HOST:8000
            ```

            Container image:

            ```
            docker pull quay.io/weka.io/wekai:${{ steps.semver.outputs.new_tag }}
            ```

            CLI (binary is named `wekai`):

            ```
            go install github.com/weka/wekai-core/cmd/wekai@${{ steps.semver.outputs.new_tag }}
            ```
