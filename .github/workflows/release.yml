name: release

# On every push to main: derive the next semver from Conventional Commits
# (feat: -> minor, fix: -> patch, BREAKING CHANGE/! -> major; see CLAUDE.md —
# semantic commits are mandatory in this repo), publish the image + Helm
# chart under that semver via the repo's own Dagger module (overriding the
# local content-hash v999.0.0-<sha12> scheme), and create a GitHub Release
# with install instructions.
#
# No release is cut when no feat/fix/breaking commits landed since the last
# tag (docs/chore/ci-only pushes are silent).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the tag action walks commits since the last tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # One definition, so the release gate and local runs cannot drift.
      # Deliberately NOT `task verify`: that adds gofmt and -race, and a
      # formatting slip should not block a release. The pull-request gate in
      # ci.yml is where the stricter checks belong.
      - name: Test
        run: task test

      - name: Compute next semver from Conventional Commits
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false # no feat/fix/breaking since last tag -> no release
          tag_prefix: v

      - name: No release needed
        if: steps.semver.outputs.new_tag == ''
        run: echo "No feat/fix/BREAKING commits since ${{ steps.semver.outputs.previous_tag }} — skipping release."

      - name: Free runner disk space
        if: steps.semver.outputs.new_tag != ''
        # The image embeds a ~9.5 GB (uncompressed) replay layer; assembling
        # and exporting it inside the dagger engine exceeds the runner's
        # default free disk. Dropping preinstalled toolchains frees ~25-30 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Log in to quay.io
        if: steps.semver.outputs.new_tag != ''
        run: echo "${{ secrets.QUAY_PASSWORD }}" | docker login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Install Dagger CLI
        if: steps.semver.outputs.new_tag != ''
        run: |
          cd /usr/local
          # 0.19.10 matches the locally-proven setup: the module pins
          # engineVersion v0.18.6 (compat mode), but a v0.18.6 ENGINE cannot
          # serve the introspection query of the freshly-resolved Python SDK
          # ("Unknown argument includeDeprecated") — the 0.19.10 CLI/engine can.
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.19.10 sh
          dagger version

      - name: Build release binaries
        if: steps.semver.outputs.new_tag != ''
        # linux amd64+arm64, macOS arm64 (Apple Silicon) only.
        run: |
          set -euo pipefail
          VERSION="${{ steps.semver.outputs.new_tag }}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            out="dist/wekai_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 go build -trimpath -o "${out}/wekai" .
            tar -czf "dist/wekai_${VERSION}_${GOOS}_${GOARCH}.tar.gz" -C "${out}" wekai
          done
          ls -lh dist/*.tar.gz

      # Two images and two charts from one commit under one semver. The
      # benchmark pair embeds the multi-GB replay artifact; the router pair does
      # not, because a router never reads it. Publishing both here is what keeps
      # them from drifting: a release either ships a matched set or fails.
      - name: Publish benchmark image + chart under semver (dagger push-helm)
        if: steps.semver.outputs.new_tag != ''
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          dagger call push-helm \
            --source=. \
            --helm-username=env://QUAY_USERNAME \
            --helm-password=env://QUAY_PASSWORD \
            --version "${{ steps.semver.outputs.new_tag }}"

      - name: Publish router image + chart under semver (dagger push-router-helm)
        if: steps.semver.outputs.new_tag != ''
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          dagger call push-router-helm \
            --source=. \
            --helm-username=env://QUAY_USERNAME \
            --helm-password=env://QUAY_PASSWORD \
            --version "${{ steps.semver.outputs.new_tag }}"

      - name: Create GitHub Release
        if: steps.semver.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.new_tag }}
          generate_release_notes: true
          files: dist/*.tar.gz
          body: |
            ## Install

            Prebuilt binaries (linux amd64/arm64, macOS Apple Silicon) are
            attached below, e.g.:

            ```
            curl -fsSL https://github.com/weka/wekai/releases/download/${{ steps.semver.outputs.new_tag }}/wekai_${{ steps.semver.outputs.new_tag }}_$(uname -s | tr A-Z a-z)_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz | tar -xz
            ```

            ### Benchmark

            Replay benchmark against your endpoint (see chart README for all values).
            This image embeds the replay artifact, so no volume or fetch step is needed:

            ```
            helm upgrade --install my-replay oci://quay.io/weka.io/helm/wekai \
              --version ${{ steps.semver.outputs.new_tag }} \
              --set endpoint=http://YOUR-LLM-HOST:8000
            ```

            ```
            docker pull quay.io/weka.io/wekai:${{ steps.semver.outputs.new_tag }}
            ```

            ### Router

            Model-aware LLM router with prefix-cache affinity. Separate,
            replay-less image — same binary, without the multi-GB replay layer a
            router never reads.

            Point it at your fleet by pod label. Each discovered pod contributes
            its own port, so several DaemonSets on different ports stay one pool:

            ```
            helm upgrade --install my-router oci://quay.io/weka.io/helm/wekai-router \
              --version ${{ steps.semver.outputs.new_tag }} \
              --set-string 'router.backends[0].pods.app=vllm' \
              --set-string 'router.backends[0].port=http'
            ```

            A static list works the same way, and the two can be mixed:

            ```
              --set-string 'router.backends[0]=http://vllm-a:8000' \
              --set-string 'router.backends[1]=http://vllm-b:8000'
            ```

            Per-model routes, a hosted fallback and credentials are in
            [docs/router.md](https://github.com/weka/wekai/blob/main/docs/router.md).

            ```
            docker pull quay.io/weka.io/wekai-router:${{ steps.semver.outputs.new_tag }}
            ```

            CLI (binary is named `wekai`):

            ```
            go install github.com/weka/wekai@${{ steps.semver.outputs.new_tag }}
            ```
