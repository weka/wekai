---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wllm-router
  namespace: inference
  labels:
    app.kubernetes.io/name: wllm-router
---
# Minimal RBAC (SD-8). A Role, not a ClusterRole: discovery is namespace-scoped,
# so the router never needs cluster-wide read. v1 defaulted to Api::all when no
# namespace was configured, which quietly required cluster-wide pod read.
#
# `endpointslices` alone is sufficient for the recommended discovery mode. The
# `pods` rule is only needed for --discovery-mode=pod; delete it otherwise.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wllm-router-discovery
  namespace: inference
  labels:
    app.kubernetes.io/name: wllm-router
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Required only for --discovery-mode=pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wllm-router-discovery
  namespace: inference
  labels:
    app.kubernetes.io/name: wllm-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wllm-router-discovery
subjects:
  - kind: ServiceAccount
    name: wllm-router
    namespace: inference
