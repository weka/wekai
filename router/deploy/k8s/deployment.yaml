---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wllm-router
  namespace: inference
  labels:
    app.kubernetes.io/name: wllm-router
data:
  config.json: |
    {
      "listen": ":8080",
      "metrics_listen": "0.0.0.0:29000",
      "policy": "least-outstanding",
      "max_body_bytes": 67108864,
      "max_attempts": 2,
      "max_inflight_per_backend": 1,
      "health_interval": "10s",
      "health_timeout": "5s",
      "health_path": "/health",
      "drain_deadline": "60s",
      "log_level": "info",
      "log_format": "json",
      "discovery": {
        "enabled": true,
        "mode": "endpointslice",
        "namespace": "inference",
        "service": "vllm",
        "port_name": "http",
        "scheme": "http",
        "resync_interval": "5m"
      }
    }
---
# The inbound API key. Create it out of band, e.g.
#   kubectl -n inference create secret generic wllm-router-auth \
#     --from-literal=api-key="$(openssl rand -hex 32)"
#
# It is mounted as a file rather than passed as an env var or a flag: a flag value
# is visible in `ps` to anything sharing the namespace (CFG-8), and a file can be
# rotated without rebuilding the pod spec.
apiVersion: v1
kind: Secret
metadata:
  name: wllm-router-auth
  namespace: inference
  labels:
    app.kubernetes.io/name: wllm-router
type: Opaque
stringData:
  api-key: "REPLACE-ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wllm-router
  namespace: inference
  labels:
    app.kubernetes.io/name: wllm-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wllm-router
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wllm-router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "29000"
        prometheus.io/path: "/metrics"
        # Roll the pods when the config changes. Replace with a real checksum in
        # your templating layer; a stale ConfigMap is otherwise invisible.
        checksum/config: "replace-with-config-hash"
    spec:
      serviceAccountName: wllm-router
      # Give in-flight streams time to finish. Must exceed drain_deadline plus the
      # preStop sleep, or the kubelet SIGKILLs mid-generation.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: ghcr.io/weka/wllm-router:dev
          imagePullPolicy: IfNotPresent
          args:
            - -config=/etc/wllm-router/config.json
            - -api-key-file=/etc/wllm-router-auth/api-key
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 29000
              protocol: TCP
          env:
            # Used only in log lines and /get_server_info, to identify a pod.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # GET /liveness is the one endpoint exempt from auth and from the path
          # allowlist, precisely so an httpGet probe works. v1 required an exec
          # probe here, which is impossible on a distroless image with no shell.
          livenessProbe:
            httpGet:
              path: /liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # /readiness reports 503 when no backend is healthy, so a router with a
          # dead fleet is pulled from the Service rather than blackholing traffic.
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # Readiness gates traffic; startup gives a cold fleet time to pass its
          # first health check without the liveness probe killing the pod.
          startupProbe:
            httpGet:
              path: /liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:
              # Endpoint removal is eventually consistent: without a pause, the
              # kubelet can start shutdown before kube-proxy has stopped sending
              # new connections. The router flips readiness on SIGTERM, but this
              # closes the propagation gap.
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              # No CPU limit: throttling a proxy inflates tail latency badly.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/wllm-router
              readOnly: true
            - name: auth
              mountPath: /etc/wllm-router-auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: wllm-router
        - name: auth
          secret:
            secretName: wllm-router-auth
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: wllm-router
---
apiVersion: v1
kind: Service
metadata:
  name: wllm-router
  namespace: inference
  labels:
    app.kubernetes.io/name: wllm-router
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wllm-router
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 29000
      targetPort: metrics
      protocol: TCP
---
# A rolling update must not drop the fleet below one serving replica.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wllm-router
  namespace: inference
  labels:
    app.kubernetes.io/name: wllm-router
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wllm-router
