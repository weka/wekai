imageRepository: quay.io/weka.io/wekai
imageTag: ""  # defaults to .Chart.AppVersion
# Optional — the image repo above is public. Only needed if you pull through
# an authenticated mirror/proxy or host your own copy, e.g.:
#   imagePullSecrets:
#     - name: my-pull-secret
imagePullSecrets: []

# The only supported run mode: replay the router-replay JSONL baked into the
# image (at /wekai/replay.jsonl, see this repo's Dockerfile) against a
# target model endpoint via `wekai benchmark auto --router-replay-file`.
# There is no docs-dir/model-list mode here — for those, or for
# multiple endpoints in one run, use the wekai binary directly.

# Target model endpoint — the only value most installs need to set, e.g.:
#   --set endpoint=http://10.71.0.4:8000
# Accepts a bare host:port (autodiscovers the /v1 path and, unless `model`
# below is set, the model id too — see llm.NormalizeModelSpec /
# ParseDynamicModel) or a full "dynamic/...,type=..." spec for anything
# non-default (e.g. "http://10.71.0.4:8000,type=anthropic"). Required — the
# chart renders without --models and the binary fails fast with a clear
# error if this is left empty.
endpoint: ""

# Optional explicit model id. Appended to `endpoint` as ",model=<value>".
# Leave empty to rely on autodiscovery.
model: ""

# Overall run duration, mapped to `benchmark auto --timeout`. Lower this for
# smoke tests, e.g. --set duration=3m.
duration: "8h"

# Advanced/optional replay knobs — sane defaults, rarely need changing.
replay:
  replayFile: /wekai/replay.jsonl  # path baked into the image by the Dockerfile
  replayRoles: ""          # comma-separated instance roles to replay (empty = all)
  replaySeries: 0          # cap on sessions replayed — subset selection (0 = all in the file)
  series: 256              # parallel series workers replaying sessions (--series; 0 = binary default ramp)
  replayNoStamp: false     # disable per-run cache-busting stamp (bitwise-faithful replay)
  maxOutputTokens: 0       # override max output tokens per request (0 = use replay-file's own budgets)
  concurrency: 28          # fixed concurrency (0 = auto hill-climber)
  hotConcurrency: 4        # H workers form a 'hot' pool with a dedicated gate (--hot-series-concurrency; 0 = off)
  maxConcurrency: 0        # hill-climber upper bound, only relevant when concurrency=0 (0 = binary default)
  requestTimeout: ""       # per-request timeout, e.g. "5m"
  abortOnCollapse: false   # abort if windowed cache hit rate collapses
  replayStopAtLowConcurrency: false
  stderrLogs: false

  # Dry-run mode: simulate the replay's timing/rates offline (no real
  # requests) using synthetic cold/warm/output token rates.
  dryRun: false
  dryRunColdTPS: 0
  dryRunWarmTPS: 0
  dryRunOutputTPS: 0

llmApiKeySecretName: ""   # K8s secret with LLM API key env vars (OPENAI_API_KEY, ANTHROPIC_API_KEY, ...)

# ── Results ─────────────────────────────────────────────────────────────────
# Per-request JSONL data + the auto-generated report.html are ALWAYS saved
# (--save-request-data) under resultsMountPath/<run-timestamp>/. That is not
# configurable; the only choice is what storage backs that path:
#
#   nothing set               ephemeral emptyDir — results go away with the pod
#   resultsClaim=<pvc-name>   mount a PVC you already created (nothing else needed)
#   createResultsClaim=true   chart provisions its own PVC, <release>-results
#
# After the benchmark finishes (or fails) the pod sleeps so you can
# explore/extract results (kubectl exec / kubectl cp); delete the pod to have
# the Deployment restart the benchmark — the volume survives that either way.
resultsMountPath: /results

# Mount an existing PVC. The only value needed to persist results onto storage
# you already manage; storageClassName/storageSize/createResultsClaim are all
# ignored, since the volume already exists and is yours to size and delete.
resultsClaim: ""

# Have the chart provision the PVC instead. It is annotated
# helm.sh/resource-policy: keep, so `helm uninstall` leaves the results behind
# — delete the PVC by hand once you've pulled them off.
createResultsClaim: false
storageClassName: ""       # empty = cluster default
storageSize: 10Gi          # PVC size, chart-provisioned claim only

# Deprecated: the old name for createResultsClaim, still honored so existing
# values files keep persisting instead of silently falling back to emptyDir.
storeResults: false

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "4Gi"
    cpu: "4"
