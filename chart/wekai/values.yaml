imageRepository: quay.io/weka.io/wekai
imageTag: ""  # defaults to .Chart.AppVersion
# Optional — the image repo above is public. Only needed if you pull through
# an authenticated mirror/proxy or host your own copy, e.g.:
#   imagePullSecrets:
#     - name: my-pull-secret
imagePullSecrets: []

# The only supported run mode: replay the router-replay JSONL baked into the
# image (at /wekai/replay.jsonl, see this repo's Dockerfile) against a
# target model endpoint via `wekai benchmark auto --router-replay-file`.
# There is no docs-dir/model-list mode here — for those, or for
# multiple endpoints in one run, use the wekai binary directly.

# Target model endpoint — the only value most installs need to set, e.g.:
#   --set endpoint=http://10.71.0.4:8000
# Accepts a bare host:port (autodiscovers the /v1 path and, unless `model`
# below is set, the model id too — see llm.NormalizeModelSpec /
# ParseDynamicModel) or a full "dynamic/...,type=..." spec for anything
# non-default (e.g. "http://10.71.0.4:8000,type=anthropic"). Required — the
# chart renders without --models and the binary fails fast with a clear
# error if this is left empty.
endpoint: ""

# Optional explicit model id. Appended to `endpoint` as ",model=<value>".
# Leave empty to rely on autodiscovery.
model: ""

# Overall run duration, mapped to `benchmark auto --timeout`. Lower this for
# smoke tests, e.g. --set duration=3m.
duration: "8h"

# Advanced/optional replay knobs — sane defaults, rarely need changing.
replay:
  replayFile: /wekai/replay.jsonl  # path baked into the image by the Dockerfile
  replayRoles: ""          # comma-separated instance roles to replay (empty = all)
  replaySeries: 0          # cap on sessions replayed — subset selection (0 = all in the file)
  series: 256              # parallel series workers replaying sessions (--series; 0 = binary default ramp)

  # ── Real-time replay and session admission ────────────────────────────────
  # Together these change what the run measures. The default (both off) holds
  # a FIXED series pool and asks "how does the fleet behave at concurrency N".
  # Turning them on asks "what is the most load this fleet can carry", and the
  # answer is no longer a number set here.
  #
  # realtime is the switch. It paces each session by the timestamps it was
  # captured with, so a conversation keeps its own think time instead of firing
  # back-to-back — the recorded gap includes the ORIGINAL response time, which
  # this fleet will not reproduce, so it is a floor rather than a schedule and a
  # slower fleet makes the session fall behind rather than issue a backlog.
  #
  # It also takes over the session count: `series` is NOT passed, because the
  # count climbs on its own under the TTFT governor below. Passing a fixed pool
  # alongside would pin max-series and halt the run there, reporting the pool
  # size as the fleet's ceiling.
  realtime: false
  # skipIdle jumps the clock when NOTHING is in flight and every active session
  # is waiting on its next turn — captured median gap ~8s against a ~4min mean,
  # so a faithful replay is mostly a replay of nobody typing. Safe because the
  # idle precondition means no in-flight request can have its latency distorted.
  # Rarely fires once the run is loaded, which is the intent.
  skipIdle: false
  # admitEvery is how fast the count climbs under realtime: one session, then
  # one more this often while the fleet keeps up. Concurrency is then whatever
  # the fleet's latency implies rather than a number set here. Ignored unless
  # realtime is on.
  #
  # NOT a neutral knob. On a fleet that answers fast this rate, not the fleet,
  # becomes the limit: simulated at a 0.90 cache hit rate, one-per-second finds
  # 52.8 req/s at 36% prefill utilisation while five-per-second finds 140.7 at
  # 97%. Run two rates and check the answer stopped moving before believing it.
  admitEvery: "1s"
  # ttftLimit pauses admission while the windowed mean TTFT is at or above it,
  # and resumes below. This is the definition of "sustained" for the run — max
  # sessions at 5s and at 1s are different capacity numbers for one fleet — so
  # it belongs in the record whether or not you change it.
  ttftLimit: "5s"
  # ttftWindow is how far back the gate averages. A duration and not a request
  # count on purpose: a count is a different amount of history at every load
  # level, so a count-based gate tightens as the fleet fills.
  ttftWindow: "30s"
  # maxSessions is the safety cap on the governor, nothing more. Simulation of
  # this workload reaches ~2,500 sessions on a cache-starved fleet and >12,000
  # on a well-cached one, so a cap near either is a cap you will hit. If the run
  # stops here it logs that it measured the cap rather than the fleet — but the
  # cheaper habit is to set it far above any plausible ceiling.
  maxSessions: 100000

  replayNoStamp: false     # disable per-run cache-busting stamp (bitwise-faithful replay)
  maxOutputTokens: 0       # override max output tokens per request (0 = use replay-file's own budgets)
  concurrency: 28          # fixed concurrency (0 = auto hill-climber)
  hotConcurrency: 4        # H workers form a 'hot' pool with a dedicated gate (--hot-series-concurrency; 0 = off)
  maxConcurrency: 0        # hill-climber upper bound, only relevant when concurrency=0 (0 = binary default)
  requestTimeout: ""       # per-request timeout, e.g. "5m"
  abortOnCollapse: false   # abort if windowed cache hit rate collapses
  replayStopAtLowConcurrency: false
  stderrLogs: false

  # Print request errors to the pod log as they happen, rate-limited to at
  # most one line per this interval. On by default: the run summary only ever
  # reported an error *count*, so a pod quietly failing every request looked
  # the same as one succeeding until you dug the JSONL off the volume. Rate
  # limiting is what makes it safe to leave on — a total outage costs one line
  # per second, not one per failed request. Set "" (or 0) for silence.
  printErrorsThreshold: "1s"

  # Dry-run mode: simulate the replay's timing/rates offline (no real
  # requests) using synthetic cold/warm/output token rates.
  dryRun: false
  dryRunColdTPS: 0
  dryRunWarmTPS: 0
  dryRunOutputTPS: 0

llmApiKeySecretName: ""   # K8s secret with LLM API key env vars (OPENAI_API_KEY, ANTHROPIC_API_KEY, ...)

# ── Results ─────────────────────────────────────────────────────────────────
# Per-request JSONL data + the auto-generated report.html are ALWAYS saved
# (--save-request-data) under
# resultsMountPath/resultsSubPath/<run-timestamp>/. Saving is not
# configurable; the only choices are where under the volume it lands and what
# storage backs it:
#
#   nothing set               ephemeral emptyDir — results go away with the pod
#   resultsClaim=<pvc-name>   mount a PVC you already created (nothing else needed)
#   createResultsClaim=true   chart provisions its own PVC, <release>-results
#
# After the benchmark finishes (or fails) the pod sleeps so you can
# explore/extract results (kubectl exec / kubectl cp); delete the pod to have
# the Deployment restart the benchmark — the volume survives that either way.
resultsMountPath: /results

# Subdirectory of resultsMountPath that wekai writes into, so run directories
# don't land loose at the volume root — the same PVC is usually shared across
# purposes. The whole volume stays mounted at resultsMountPath (this is NOT a
# volumeMount subPath), so everything else on it remains visible to
# kubectl exec/cp; only what wekai writes is namespaced.
#
#   default          /results/wekai-requests-data/<run-timestamp>/
#   ""               /results/<run-timestamp>/   — flat, at the volume root
#   some/other/dir   /results/some/other/dir/<run-timestamp>/
#
# Setting it to an EXPLICIT empty string is what selects the flat layout;
# leaving it out (or null) keeps the default.
resultsSubPath: wekai-requests-data

# Mount an existing PVC. The only value needed to persist results onto storage
# you already manage; storageClassName/storageSize/createResultsClaim are all
# ignored, since the volume already exists and is yours to size and delete.
resultsClaim: ""

# Have the chart provision the PVC instead. It is annotated
# helm.sh/resource-policy: keep, so `helm uninstall` leaves the results behind
# — delete the PVC by hand once you've pulled them off.
createResultsClaim: false
storageClassName: ""       # empty = cluster default
storageSize: 10Gi          # PVC size, chart-provisioned claim only

# Deprecated: the old name for createResultsClaim, still honored so existing
# values files keep persisting instead of silently falling back to emptyDir.
storeResults: false

# ── Scheduling ──────────────────────────────────────────────────────────────
# Where the benchmark pod lands. It is a load generator pointed at `endpoint`,
# so it wants a short network path to the inference nodes without running on
# them — sharing a GPU node's CPU with the server skews the very TTFT numbers
# the run exists to measure. Tolerations are usually the way onto a pool that
# is tainted for inference; a nodeSelector is the way to stay off it.
#
#   nodeSelector:
#     node-role.kubernetes.io/worker: ""
#     topology.kubernetes.io/zone: us-east-1a
#
#   tolerations:
#     - key: nvidia.com/gpu
#       operator: Exists
#       effect: NoSchedule
#
# Note the PVC (resultsClaim or a chart-provisioned one) is ReadWriteOnce, so
# on zonal storage these must not conflict with the volume's own zone.
nodeSelector: {}
tolerations: []

# Requests are sized for the real workload — 256 series workers holding
# replay sessions, prompt buffers and the cache estimator — rather than the
# idle floor, so the scheduler reserves what the run actually uses instead of
# discovering it under load.
#
# No limits by design. A CPU limit makes CFS throttle the process in exactly
# the moments it is busiest, and a throttled load generator adds its own
# latency to every TTFT and token-rate number the run reports — measurement
# error indistinguishable from a slow server. Add limits back only if a
# namespace LimitRange requires them, and set the CPU one well above the
# request if you do:
#
#   resources:
#     limits:
#       memory: "16Gi"
#       cpu: "8"
resources:
  requests:
    memory: "8Gi"
    cpu: "4"
