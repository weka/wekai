apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wekai.fullname" . }}
  labels:
    {{- include "wekai.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wekai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wekai.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.imageRepository }}:{{ .Values.imageTag | default .Chart.AppVersion }}
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - |
              # Build argv once into the positional params, then echo and run
              # it. The flag list below stays the single source of truth — a
              # separate echo of the same command would drift the moment one
              # of these conditionals changed.
              set -- wekai benchmark auto \
                --router-replay-file={{ .Values.replay.replayFile }} \
                {{- if .Values.endpoint }}
                --models={{ if .Values.model }}{{ printf "%s,model=%s" .Values.endpoint .Values.model | quote }}{{ else }}{{ .Values.endpoint | quote }}{{ end }} \
                {{- end }}
                {{- if .Values.duration }}
                --timeout={{ .Values.duration }} \
                {{- end }}
                {{- if .Values.replay.replayRoles }}
                --router-replay-roles={{ .Values.replay.replayRoles }} \
                {{- end }}
                {{- if .Values.replay.replaySeries }}
                --replay-series={{ .Values.replay.replaySeries | int64 }} \
                {{- end }}
                {{- if .Values.replay.realtime }}
                {{- /* Real-time replay grows the session count itself, so --series
                     must NOT be passed: it pins max-series too, and the run
                     would stop at the pool size and report that as the fleet's
                     ceiling. Start at one and let it climb. */}}
                --replay-realtime \
                --start-series=1 \
                --max-series={{ .Values.replay.maxSessions | int64 }} \
                --admit-every={{ .Values.replay.admitEvery }} \
                --ttft-limit={{ .Values.replay.ttftLimit }} \
                --ttft-window={{ .Values.replay.ttftWindow }} \
                {{- /* Guarded, and defaulted empty, so the chart can still deploy
                       an image from before this flag existed. A/B against a
                       previous build is the normal way this chart is used, and
                       an unconditional flag removes that — failing at startup
                       with an unknown-flag exit, from a chart the operator did
                       not think they had changed. mean is the binary's default
                       anyway, so omitting it changes nothing. */}}
                {{- with .Values.replay.ttftLimitStat }}
                --ttft-limit-stat={{ . }} \
                {{- end }}
                {{- if .Values.replay.skipIdle }}
                --replay-skip-idle \
                {{- end }}
                {{- if .Values.replay.reuseSessions }}
                --replay-reuse-sessions \
                {{- end }}
                {{- if .Values.replay.allowUnderfill }}
                --replay-allow-underfill \
                {{- end }}
                {{- else if .Values.replay.series }}
                --series={{ .Values.replay.series | int64 }} \
                {{- end }}
                {{- range .Values.replay.vllmMetricsUrls }}
                --vllm-metrics-url={{ . }} \
                {{- end }}
                {{- if .Values.replay.replayNoStamp }}
                --replay-no-stamp \
                {{- end }}
                {{- if .Values.replay.maxOutputTokens }}
                --max-output-tokens={{ .Values.replay.maxOutputTokens | int64 }} \
                {{- end }}
                {{- if not .Values.replay.realtime }}
                {{- if .Values.replay.concurrency }}
                --concurrency={{ .Values.replay.concurrency | int64 }} \
                {{- end }}
                {{- if .Values.replay.hotConcurrency }}
                --hot-series-concurrency={{ .Values.replay.hotConcurrency | int64 }} \
                {{- end }}
                {{- else if .Values.replay.concurrencyCap }}
                {{- /* Under realtime the gate is out of the way unless asked for.
                     A cap here is a deliberate ceiling, not the default 28. */}}
                --concurrency={{ .Values.replay.concurrencyCap | int64 }} \
                {{- end }}
                {{- if .Values.replay.maxConcurrency }}
                --max-concurrency={{ .Values.replay.maxConcurrency | int64 }} \
                {{- end }}
                {{- if .Values.replay.requestTimeout }}
                --request-timeout={{ .Values.replay.requestTimeout }} \
                {{- end }}
                {{- if .Values.replay.abortOnCollapse }}
                --abort-on-collapse \
                {{- end }}
                {{- if .Values.replay.replayStopAtLowConcurrency }}
                --replay-stop-at-low-concurrency \
                {{- end }}
                {{- if .Values.replay.printErrorsThreshold }}
                --print-errors-threshold={{ .Values.replay.printErrorsThreshold }} \
                {{- end }}
                {{- if .Values.replay.stderrLogs }}
                --stderr-logs \
                {{- end }}
                {{- if .Values.replay.dryRun }}
                --dry-run \
                {{- if .Values.replay.dryRunColdTPS }}
                --dry-run-cold-tps={{ .Values.replay.dryRunColdTPS | int64 }} \
                {{- end }}
                {{- if .Values.replay.dryRunWarmTPS }}
                --dry-run-warm-tps={{ .Values.replay.dryRunWarmTPS | int64 }} \
                {{- end }}
                {{- if .Values.replay.dryRunOutputTPS }}
                --dry-run-output-tps={{ .Values.replay.dryRunOutputTPS | int64 }} \
                {{- end }}
                {{- end }}
                --save-request-data={{ include "wekai.results.dataPath" . }}

              # --save-request-data is rendered last, so its presence proves the
              # whole flag list survived. A truncated `set --` does not fail: sh
              # reports the first dropped flag as an unknown command, non-fatally,
              # and "$@" then runs a valid benchmark answering a different
              # question. That is worse than a crash, so make it one.
              case " $* " in
                *" --save-request-data="*) ;;
                *) echo "FATAL: argv was truncated before --save-request-data — the flag list" \
                        "did not survive rendering, and this run would silently measure" \
                        "something else. argv was: $*" >&2
                   exit 1 ;;
              esac

              echo "+ $*"
              "$@" || echo "wekai benchmark auto exited with status $?"
              echo "Benchmark finished. Sleeping so results under {{ include "wekai.results.dataPath" . }} stay explorable (kubectl exec/cp); delete the pod to rerun."
              sleep infinity
          {{- if .Values.llmApiKeySecretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.llmApiKeySecretName }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: results
              mountPath: {{ .Values.resultsMountPath }}
      volumes:
        - name: results
          {{- $claim := include "wekai.results.claimName" . }}
          {{- if $claim }}
          persistentVolumeClaim:
            claimName: {{ $claim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
