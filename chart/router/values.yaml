# Default values for wekai-router.
#
# Deploys `wekai router serve` from the REPLAY-LESS image. The benchmark image
# carries a multi-GB embedded replay artifact that a router never reads; this
# chart deliberately does not use it. Both images are published from the same
# commit under the same semver on every release.

imageRepository: quay.io/weka.io/wekai-router
imageTag: ""  # defaults to .Chart.AppVersion
imagePullSecrets: []
nameOverride: ""

# One by default. The router keeps its cache-affinity state in memory — which
# backend holds which prefix — so replicas do not share a view of the fleet.
# Two routers each decide on half the evidence and send the same prefix to
# different backends, duplicating it across the fleet and undoing the affinity
# the router exists to provide. Scale up when a single router is genuinely the
# throughput bottleneck, knowing that is the trade.
replicaCount: 1

# Router CLI flags (see `wekai router serve --help`).
router:
  # Grace period after SIGTERM: readiness flips to 503 so k8s stops routing new
  # traffic, in-flight requests are allowed to finish, then force shutdown.
  # `terminationGracePeriodSeconds` (below) must exceed this.
  drainTimeout: 5m

  # An ENDPOINT is a URL string or a pod selector map. One grammar, used
  # everywhere an endpoint appears — in `backends` and in a route's
  # `endpoints`, which are the same list of the same things:
  #
  #   http://vllm-a:8000                    a URL
  #   {pods: {app: vllm}, port: http}       every matching pod in THIS namespace,
  #                                         each on its containerPort named http
  #   {pods: {app: vllm}, port: 8000}       ... or 8000 for a pod declaring none
  #
  # The selector is a map because --set splits values on commas: a label
  # selector is comma-separated, so the string "pods:app=vllm,tier=prod"
  # arrives truncated at its first label — silently, rendering fine and failing
  # at runtime. In a values file the string form is fine too.
  #
  # Discovery searches the router's own namespace only; see `discovery` below.
  #
  # Routing rules, first match wins. As a string, exactly as the CLI takes it:
  #   - "fast,small => http://a:8000|http://b:8000"
  #   - "sonnet => http://a:8000 as Qwen/Qwen3-32B"
  #
  # Or structured, which is what --set needs, since a multi-pattern route
  # written as one string is truncated at its first pattern the same way:
  #   - patterns: [fast, small]
  #     endpoints: [http://a:8000, http://b:8000]
  #     as: Qwen/Qwen3-32B            # optional model rewrite
  #   - patterns: ["*"]
  #     endpoints:
  #       - pods: {app: vllm}
  #         port: http
  routes: []

  # Endpoints for the implicit catch-all pool — shorthand for a single
  # "* => a|b|c" route. The simplest deployment: one fleet, every model routed
  # to it, no patterns and no rules. Takes the endpoint grammar above.
  #
  #   backends:
  #     - http://vllm-a:8000
  #     - pods: {app: vllm}
  #       port: http
  #
  # Mixing a URL and a selector is what a migration looks like.
  backends: []

  # Address for /metrics, the live KV map at /router-viz, and the kubelet's
  # /liveness and /readiness. Must not be loopback, or neither the PodMonitor
  # nor the probes can reach it.
  #
  # The probes are here rather than on the serving port because their answer is
  # operational detail — fleet size, health, and why the router is not ready —
  # and a user-facing router is routinely unauthenticated.
  metricsListen: "0.0.0.0:29000"

  # Restrict which paths may be proxied.
  #
  # Setting apiKey/apiKeyFile already restricts the router to the dialect's own
  # routes — chat/completions, completions, embeddings, models and the rest —
  # all requiring the key, with the passthrough tier and the admin endpoints
  # closed. This overrides that default with a set of your own.
  #
  # WITHOUT a key, EMPTY MEANS EVERY PATH: any path the dialect does not claim
  # is passed through to a backend, which is what lets one router front both an
  # OpenAI-style fleet and a hosted API.
  #
  # Nothing outside the list is served — there is no exempt path, not even a
  # probe. Matching is on segment boundaries, so "/v1/mod" never admits
  # "/v1/models"; a trailing "/" denotes a subtree.
  #
  #   pathAllowlist:
  #     - /v1/chat/completions
  #     - /v1/messages
  #     - /v1/models
  pathAllowlist: []

  # Split signals. The backend's own 429 is always on and needs no
  # configuration; these are opt-in early warnings that save a round trip.
  signals:
    # The backends' vLLM --max-num-seqs. Predicts saturation instead of
    # discovering it one refusal at a time. 0 = off.
    maxNodeConcurrency: 0
    # Makes maxNodeConcurrency the top of a band instead of a single cliff.
    # Below this a holder is a plain cache hit; at or above it the router
    # prefers to split elsewhere; and if nothing clears splitGuard the request
    # goes BACK to the least-loaded holder and queues there up to the hard
    # limit. That last step is the point — it keeps the request on a backend
    # that already has the KV rather than paying a full prefill on one that
    # does not, the opposite trade from transientFallbackThreshold.
    #
    # Must be below maxNodeConcurrency, which must be set. 0 = off.
    softNodeConcurrency: 0
    # Rebalance once (inflight - fleetMin)/inflight exceeds this — at 0.5, once
    # a backend carries more than twice the fleet minimum.
    #
    # A backend under 8 in-flight is never rebalanced away from, whatever the
    # proportions say. That floor is not tunable and is what keeps the ratio
    # honest: the fleet minimum is 0 whenever any backend is momentarily idle,
    # and then the ratio is 1.0 for every backend carrying anything at all —
    # so 1,1,1,0 would read as imbalanced as 20,20,20,0. They are
    # ratio-identical; only magnitude tells them apart.
    #
    # This trades locality for evenness, so it is a real trade: a fleet where
    # prefix affinity is working is SUPPOSED to look imbalanced. Set 0 to turn
    # it off and let affinity concentrate work as far as it will.
    rebalanceRatio: 0.5
    # A prefix is split onto a backend only while its in-flight is below
    # limit*(1-this). Lower and every backend ends up holding every prefix.
    splitGuard: 0.20
    # Serve a request the split guard refused WITHOUT recording the backend as
    # a holder, while it is below ref*(1-this). Must be BELOW splitGuard to do
    # anything — it is the looser bar. At 0.05 against a guard of 0.20: under
    # 80% of the holders' load a backend takes the prefix and keeps it, between
    # 80% and 95% it serves the request and is forgotten, above that the
    # request is refused. 0 = off, the guard's rejection is final.
    transientFallbackThreshold: 0
    # Keep re-deciding a request no backend can currently take for up to this
    # long before answering 429, backing off 10ms/20ms/50ms/... to 3s with
    # jitter. Capacity refusals only: they describe one instant and stop being
    # true the moment any in-flight request completes. A client would retry
    # anyway; this waits where the fleet's state is already known.
    # 0 = off, answer immediately.
    retryTimeLimit: 0s

  # Aggregate upstream vLLM counters into router-level totals on the metrics
  # listener. Only endpoints discovered to be vLLM are scraped, and totals
  # accumulate deltas so they never rewind when a pod restarts.
  vllmMetrics:
    enabled: false
    interval: 30s
    names: []
    # - vllm:prompt_tokens_by_source_total

  # Kubernetes pod discovery, used by any route written as
  # "<patterns> => pods:<label-selector>". Enable RBAC below as well.
  #
  # Each discovered pod contributes its OWN declared containerPort, which is
  # what a Service cannot express: a fleet run as several DaemonSets, one per
  # GPU topology or model, commonly listens on a different port per set, and
  # covering that with Services needs one per set — losing the single label
  # selector that made them one pool.
  # Secrets the router itself presents upstream, or its own inbound key.
  # Mounted read-only; a route then references the file with "using <path>".
  #
  #   secretMounts:
  #     - name: inner-key
  #       secretName: router-inner-key   # key inside it becomes the filename
  #       mountPath: /etc/router
  secretMounts: []

  # Read the inbound API key from a mounted file. PREFER this to apiKey below:
  # a key set as a value ends up in the Deployment spec, readable by anyone who
  # can describe the pod.
  apiKeyFile: ""

  # Require this key on inference and admin requests. Empty leaves the listener
  # unauthenticated, which the router logs loudly at startup.
  apiKey: ""

  # Optional catch-all upstream used if no --route matches.
  default: ""
  # default: "https://api.anthropic.com"

  # Patterns that trigger stripping of Authorization/x-api-key/anthropic-beta
  # headers before forwarding (useful for unauth'd internal upstreams).
  stripAuthWhen: []

  # Log full request/response headers. Verbose; may leak tokens. Leave off
  # unless debugging.
  logHeaders: false

  # Capture mode: "", "raw", or "redacted". See command_router.go for schema.
  # Default redacted: captures the per-request structured metadata (block
  # hashes, byte/token counts, tool-use ids, prompt/seed hashes) without
  # storing original prompt or response content. Operators that want full
  # raw bodies can override to "raw"; "" disables capture entirely.
  # OFF by default. Capture writes to /data, and enabling it without somewhere
  # writable crashed the pod on startup. Turn it on together with
  # datastore.sharedPvc.enabled=true to keep the records; without a PVC the
  # chart mounts an emptyDir, so they are lost with the pod.
  capture: ""

  # Optional override for capture directory. Defaults to
  # /data/router/capture/<mode> when datastore PVC is enabled; otherwise to
  # the binary default (~/.wekai/router/capture/<mode>).
  captureDir: ""

  # Async capture channel buffer size.
  captureBuffer: 512

  # Per-user path-prefix routing (opt-in). When true, requests at
  # /<user>/v1/<rest> route to /v1/<rest> upstream and the leading
  # segment is captured as `user` on each record. Lets clients
  # distinguish themselves by setting their ANTHROPIC_BASE_URL to
  # http://router-host/<user>. Default off — behavior is unchanged
  # unless this is enabled.
  userPrefix: false

# Extra CLI args appended after the standard router flags. Use for anything
# not yet surfaced in values (e.g. new flags added in the binary).
extraArgs: []

service:
  type: ClusterIP
  port: 80
  # Container listen port. Must match --listen below (just the port).
  targetPort: 25201

# Ingress: off by default. Set `domain` to expose externally.
# `className` is optional — omit to let the cluster default IngressClass take
# over (matches wekai/wekai-restricted behavior).
ingress:
  enabled: false
  className: ""
  # Defaults tuned for an nginx ingress controller in front of the router.
  # Harmless (ignored) on other ingress classes. Override/clear as needed.
  annotations:
    # nginx-ingress caps request bodies at 1m by default → large requests get
    # a 413 before reaching the router. "0" = no limit; set e.g. "32m" to cap.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # By default nginx buffers the *entire* request body (spilling to disk past
    # client-body-buffer-size) before opening the upstream connection. "off"
    # streams the body straight through to the router as it arrives.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  tls: []
  # - secretName: wekai-router-tls
  #   hosts:
  #     - router.example.com

# Domain name for the ingress host. Required when ingress.enabled is true.
domain: ""

# Optional persistent storage for capture output. When disabled the pod uses
# an emptyDir and captures vanish on restart.
datastore:
  sharedPvc:
    enabled: false
    storageClass: ""   # empty = cluster default
    size: "10Gi"

# Name of a Kubernetes secret with upstream API keys. Populated as env vars
# so the router process can forward them if a route needs it. Typically the
# router only proxies — leave empty unless an upstream rewrite needs a key.
llmApiKeySecretName: ""

# Both sections are overridable independently, and either may be emptied.
#
# No limits by default. A default limit turns the natural override — setting
# only `resources.requests` — into a hard rejection: Helm merges the maps, so
# the shipped limit survives underneath the new requests and the pod is refused
# for requests exceeding limits. The error names the limit rather than the
# merge, so the cause is not obvious from it. Unset lets a cluster's own
# LimitRange govern, which is the usual convention for a proxy.
#
# The requests are sized for a router doing real work: the prefix-affinity tree
# is held in memory and the routing decision is on every request's hot path.
# They are a scheduling floor, so a node has to have this much free for the pod
# to be placed at all — lower them for a small cluster or a test install.
resources:
  requests:
    memory: "8Gi"
    cpu: "4"
  limits: {}

podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Must exceed router.drainTimeout so the pod gets to drain in-flight requests
# before kubelet force-kills it. Default covers 5m drain + small buffer.
terminationGracePeriodSeconds: 330

# HTTP probe tuning. The router exposes /healthz (readiness — returns 503 when
# draining) and /livez (liveness — 200 while the process is up).
probes:
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 2
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    failureThreshold: 3

# PodMonitor for Prometheus Operator scrapes. /metrics is on the same router
# port (no separate listener), so scrape uses the pod's `http` port.
# Auto-disabled in clusters without the PodMonitor CRD installed (we check
# .Capabilities.APIVersions.Has at template time).
podMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  # Additional labels to attach to the PodMonitor resource — most clusters
  # need at least one label to select PodMonitors into the Prometheus Operator.
  # Typical values: { release: kube-prometheus-stack } or { prometheus: main }
  additionalLabels: {}
  # MetricRelabelings applied to scraped samples. Use to drop high-cardinality
  # labels in production (e.g. session_id) if active series count gets large.
  metricRelabelings: []

# Kubernetes endpoint discovery. Off by default: a static endpoint list is the
# common case and needs no RBAC at all. Enabling this creates a ServiceAccount,
# a namespace-scoped Role and a RoleBinding — never a ClusterRole, because
# discovery is namespace-scoped and cluster-wide read is not needed.
# Grants the router read access to pods IN ITS OWN NAMESPACE, which any route
# written as "<patterns> => pods:<selector>" needs. On by default, so pod
# discovery just works: it was previously off, and a route using pods: then
# failed at runtime with a permissions error that named nothing about this
# value. Set false for a router with only static endpoints, which needs no API
# access at all.
#
# There is no way to discover across namespaces, and that is what keeps this a
# plain Role. A ClusterRole would be a standing cluster-wide pod read on every
# router, which is a poor trade for a case a second router covers.
discovery:
  enabled: true
