apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
      role: router
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        role: router
    spec:
      {{- if .Values.discovery.enabled }}
      # Discovery reads the Kubernetes API, so the pod must run as the
      # ServiceAccount the Role is bound to. Creating the RBAC without naming it
      # here leaves the pod on `default` and the router fails at startup with no
      # token — RBAC that exists and is not used is the same as none.
      serviceAccountName: {{ include "app.fullname" . }}
      {{- end }}
      # No API token unless discovery needs one. A router serving traffic has no
      # business holding a credential for the Kubernetes API, and mounting one
      # by default is a standing privilege for nothing — but discovery reads
      # pods, so the token must be there when it is on.
      automountServiceAccountToken: {{ .Values.discovery.enabled }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.imageRepository }}:{{ .Values.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "router"
            - "serve"
            - "--listen=:{{ .Values.service.targetPort }}"
            {{- range .Values.router.routes }}
            {{- if kindIs "string" . }}
            - "--route={{ . }}"
            {{- else }}
            {{- /* Structured form: helm --set splits on commas, so a route
                   written as one string is truncated at its first model
                   pattern — silently, rendering fine and failing at runtime.
                   As lists there is no comma inside any single --set value. */}}
            - "--route={{ join "," .patterns }} => {{ join "|" .endpoints }}{{ if .as }} as {{ .as }}{{ end }}{{ if .using }} using {{ .using }}{{ end }}"
            {{- end }}
            {{- end }}
            {{- if .Values.router.default }}
            - "--default={{ .Values.router.default }}"
            {{- end }}
            {{- range .Values.router.stripAuthWhen }}
            - "--strip-auth-when={{ . }}"
            {{- end }}
            {{- if .Values.router.logHeaders }}
            - "--log-headers"
            {{- end }}
            {{- if .Values.router.capture }}
            - "--capture={{ .Values.router.capture }}"
            - "--capture-dir={{ .Values.router.captureDir | default (printf "/data/router/capture/%s" .Values.router.capture) }}"
            - "--capture-buffer={{ .Values.router.captureBuffer }}"
            {{- end }}
            {{- if .Values.router.drainTimeout }}
            - "--drain-timeout={{ .Values.router.drainTimeout }}"
            {{- end }}
            {{- if .Values.router.userPrefix }}
            - "--user-prefix"
            {{- end }}
            {{- if .Values.router.backends }}
            - "--backends={{ join "|" .Values.router.backends }}"
            {{- end }}
            {{- if .Values.router.metricsListen }}
            - "--metrics-listen={{ .Values.router.metricsListen }}"
            {{- end }}
            {{- with .Values.router.signals }}
            {{- if .maxNodeConcurrency }}
            - "--max-node-concurrency={{ .maxNodeConcurrency }}"
            {{- end }}
            {{- if .rebalanceRatio }}
            - "--rebalance-ratio={{ .rebalanceRatio }}"
            {{- end }}
            {{- if .splitGuard }}
            - "--cache-split-guard={{ .splitGuard }}"
            {{- end }}
            {{- end }}
            {{- if .Values.router.vllmMetrics.enabled }}
            - "--vllm-metrics"
            - "--vllm-metrics-interval={{ .Values.router.vllmMetrics.interval }}"
            {{- range .Values.router.vllmMetrics.names }}
            - "--vllm-metrics-name={{ . }}"
            {{- end }}
            {{- end }}
            {{- with .Values.router.discovery }}
            {{- if .namespace }}
            - "--discover-namespace={{ .namespace }}"
            {{- end }}
            {{- if .port }}
            - "--discover-port={{ .port }}"
            {{- end }}
            {{- if .portName }}
            - "--discover-port-name={{ .portName }}"
            {{- end }}
            {{- end }}
            {{- if .Values.router.apiKeyFile }}
            - "--api-key-file={{ .Values.router.apiKeyFile }}"
            {{- else if .Values.router.apiKey }}
            - "--api-key={{ .Values.router.apiKey }}"
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if .Values.llmApiKeySecretName }}
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmApiKeySecretName }}
                  key: GEMINI_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmApiKeySecretName }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmApiKeySecretName }}
                  key: ANTHROPIC_API_KEY
                  optional: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /liveness
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- if or .Values.resources.requests .Values.resources.limits }}
          resources:
            {{- with .Values.resources.requests }}
            requests:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.resources.limits }}
            limits:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- end }}
          {{- if or .Values.datastore.sharedPvc.enabled .Values.router.capture .Values.router.secretMounts }}
          volumeMounts:
            {{- range .Values.router.secretMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
            {{- if or .Values.datastore.sharedPvc.enabled .Values.router.capture }}
            - name: data
              mountPath: /data
            {{- end }}
          {{- end }}
      {{- if or .Values.datastore.sharedPvc.enabled .Values.router.capture .Values.router.secretMounts }}
      volumes:
        {{- range .Values.router.secretMounts }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secretName }}
            # 0444, not 0400: the image runs as a nonroot UID and 0400 makes
            # the file readable only by its owner (root), so the router cannot
            # read the key it was given. The pod is the boundary here — anything
            # that can read this file is already inside it.
            defaultMode: 0444
        {{- end }}
        {{- if or .Values.datastore.sharedPvc.enabled .Values.router.capture }}
        - name: data
          {{- if .Values.datastore.sharedPvc.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "app.fullname" . }}-router-capture
          {{- else }}
          # Capture without a PVC: records land on the node and go with the pod.
          # That is fine for a short-lived test and useless for collecting a
          # corpus, which is why capture is off by default — turning it on
          # without a PVC should not silently look like it is retaining data.
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
