apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
      role: router
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        role: router
    spec:
      automountServiceAccountToken: false
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.imageRepository }}:{{ .Values.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "router"
            - "serve"
            - "--listen=:{{ .Values.service.targetPort }}"
            {{- range .Values.router.routes }}
            - "--route={{ . }}"
            {{- end }}
            {{- if .Values.router.default }}
            - "--default={{ .Values.router.default }}"
            {{- end }}
            {{- range .Values.router.stripAuthWhen }}
            - "--strip-auth-when={{ . }}"
            {{- end }}
            {{- if .Values.router.logHeaders }}
            - "--log-headers"
            {{- end }}
            {{- if .Values.router.capture }}
            - "--capture={{ .Values.router.capture }}"
            - "--capture-dir={{ .Values.router.captureDir | default (printf "/data/router/capture/%s" .Values.router.capture) }}"
            - "--capture-buffer={{ .Values.router.captureBuffer }}"
            {{- end }}
            {{- if .Values.router.drainTimeout }}
            - "--drain-timeout={{ .Values.router.drainTimeout }}"
            {{- end }}
            {{- if .Values.router.userPrefix }}
            - "--user-prefix"
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if .Values.llmApiKeySecretName }}
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmApiKeySecretName }}
                  key: GEMINI_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmApiKeySecretName }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmApiKeySecretName }}
                  key: ANTHROPIC_API_KEY
                  optional: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.datastore.sharedPvc.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if .Values.datastore.sharedPvc.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "app.fullname" . }}-router-capture
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
