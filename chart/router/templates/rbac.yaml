{{- if .Values.discovery.enabled }}
# Kubernetes endpoint discovery, off by default.
#
# A Role, not a ClusterRole: discovery is namespace-scoped, so the router never
# needs cluster-wide read. v1 defaulted to all-namespaces when none was
# configured, which quietly required cluster-wide pod read.
#
# endpointslices alone covers the recommended mode; the pods rule is needed only
# for pod-mode discovery and is gated separately so a deployment that does not
# use it does not grant it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "app.fullname" . }}-discovery
  labels:
    {{- include "app.labels" . | nindent 4 }}
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  {{- if eq .Values.discovery.mode "pod" }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "app.fullname" . }}-discovery
  labels:
    {{- include "app.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "app.fullname" . }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "app.fullname" . }}
{{- end }}
