{{- if .Values.discovery.enabled }}
# Kubernetes endpoint discovery, ON by default.
#
# A Role, not a ClusterRole: discovery is namespace-scoped, so the router never
# needs cluster-wide read. v1 defaulted to all-namespaces when none was
# configured, which quietly required cluster-wide pod read.
#
# Pods only — see the rule below for why there is nothing else to grant.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "app.fullname" . }}-discovery
  labels:
    {{- include "app.labels" . | nindent 4 }}
rules:
  # Pods only. The router discovers by LABEL SELECTOR — a route written as
  # "pods:<selector>" — because each pod then contributes its own declared
  # port, which a Service cannot express. There is no EndpointSlice mode to
  # grant for, and granting one anyway would be a permission nothing uses.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "app.fullname" . }}-discovery
  labels:
    {{- include "app.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "app.fullname" . }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "app.fullname" . }}
{{- end }}
