{{- /*
PodMonitor — Prometheus Operator scrape config. Gated on:
  1. podMonitor.enabled (default true)
  2. the PodMonitor CRD being installed on the cluster

If the cluster doesn't have Prometheus Operator (CRD absent), this template
renders nothing and `helm install` succeeds without warnings. The
.Capabilities.APIVersions check is evaluated at template time, so a chart
release made before the operator was installed needs a `helm upgrade` after
the operator lands.

We scrape the same pod port as the router itself — /metrics is mounted on
the router's listener, not a separate sidecar — so no extra container port
or NetworkPolicy hole is needed.
*/}}
{{- if .Values.podMonitor.enabled -}}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" -}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    role: router
    {{- with .Values.podMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
      role: router
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.podMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.podMonitor.scrapeTimeout | quote }}
      {{- with .Values.podMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
